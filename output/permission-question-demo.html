<div id="willump-permission-question">
  <style>
    #willump-permission-question .pq-stage {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 22px 12px;
    }
    #willump-permission-question .pq-device {
      box-sizing: border-box;
      width: min(100%, 352px);
      overflow: hidden;
      border: 9px solid #17212b;
      border-radius: 21px;
      background: #060e18;
    }
    #willump-permission-question .pq-device canvas {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 3;
    }
    #willump-permission-question .pq-status {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
      margin: 12px 0;
    }
    #willump-permission-question .pq-progress {
      display: block;
      margin-top: 14px;
    }
  </style>
  <div class="pq-stage viz-dotted-background">
    <div class="pq-device" aria-label="StackChan 等待审批问号显示">
      <canvas id="pq-screen" width="640" height="480" role="img" aria-label="问号从上方落下，触地回弹，地面圆环扩散，最后保持问号等待批准"></canvas>
    </div>
  </div>
  <div class="pq-status">
    <span id="pq-phase" aria-live="polite">保持等待</span>
    <span class="text-small text-muted tabular-nums" id="pq-time" aria-hidden="true">1.35 秒</span>
  </div>
  <div class="viz-controls">
    <button class="btn btn-primary" id="pq-replay" type="button">重播问号落地</button>
    <button class="btn" id="pq-pause" type="button" disabled>暂停</button>
    <label class="form-check">
      <input class="form-check-input" id="pq-sound" type="checkbox" checked>
      <span class="form-check-label">问号音效</span>
    </label>
  </div>
  <div class="pq-progress">
    <label class="form-label" for="pq-seek">动画进度</label>
    <input class="form-range" id="pq-seek" type="range" min="0" max="1350" step="1" value="1350" aria-label="拖动查看问号落地的各个阶段">
  </div>

  <script>
    (() => {
      const root = document.getElementById("willump-permission-question");
      const canvas = root.querySelector("#pq-screen");
      const context = canvas.getContext("2d");
      const replay = root.querySelector("#pq-replay");
      const pause = root.querySelector("#pq-pause");
      const seek = root.querySelector("#pq-seek");
      const sound = root.querySelector("#pq-sound");
      const phaseLabel = root.querySelector("#pq-phase");
      const timeLabel = root.querySelector("#pq-time");
      const audio = root.querySelector("#pq-audio");
      const frameSources = JSON.parse(root.querySelector("#pq-frames").textContent);
      const duration = 1350;
      const framesPerSecond = 30;
      const settings = { iconWidth: 118, speed: 1 };
      let frames = [];
      let ready = false;
      let elapsed = duration;
      let playing = false;
      let lastFrameAt = 0;
      let animation = 0;
      let lastPhase = "";
      const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

      function applySettings(saved) {
        const values = saved && saved.modelContent;
        if (values) {
          if (Number.isFinite(values.iconWidth)) {
            settings.iconWidth = Math.max(90, Math.min(120, values.iconWidth));
          }
          if (Number.isFinite(values.speed)) {
            settings.speed = Math.max(0.6, Math.min(1.4, values.speed));
          }
        }
        if (typeof saved?.privateContent?.sound === "boolean") {
          sound.checked = saved.privateContent.sound;
        }
      }

      function saveSettings() {
        if (typeof window.openai?.setWidgetState === "function") {
          window.openai.setWidgetState({
            modelContent: { iconWidth: settings.iconWidth, speed: settings.speed },
            privateContent: { sound: sound.checked },
          }).catch(() => {});
        }
      }

      function phaseAt(milliseconds) {
        if (milliseconds < 420) return "问号下落";
        if (milliseconds < 720) return "触地回弹";
        if (milliseconds < duration) return "波纹扩散";
        return "保持等待";
      }

      function draw() {
        context.setTransform(2, 0, 0, 2, 0, 0);
        context.fillStyle = "#060e18";
        context.fillRect(0, 0, 320, 240);
        if (ready) {
          const frame = Math.min(frames.length - 1, Math.floor(elapsed * framesPerSecond / 1000));
          const width = settings.iconWidth;
          const height = width * 1.72;
          context.imageSmoothingEnabled = true;
          context.drawImage(frames[frame], (320 - width) / 2, Math.max(8, (218 - height) / 2), width, height);
        }
        context.fillStyle = "#397080";
        context.beginPath();
        context.arc(160, 220, 2, 0, Math.PI * 2);
        context.fill();
        seek.value = String(Math.round(elapsed));
        timeLabel.textContent = `${(elapsed / 1000).toFixed(2)} 秒`;
        const phase = phaseAt(elapsed);
        if (phase !== lastPhase) {
          lastPhase = phase;
          phaseLabel.textContent = phase;
        }
        pause.disabled = !ready || elapsed >= duration;
        pause.textContent = playing ? "暂停" : "继续";
      }

      function stop() {
        playing = false;
        cancelAnimationFrame(animation);
        audio.pause();
      }

      function tick(now) {
        if (!playing) return;
        elapsed = Math.min(duration, elapsed + Math.max(0, now - lastFrameAt) * settings.speed);
        lastFrameAt = now;
        if (elapsed >= duration) playing = false;
        draw();
        if (playing) animation = requestAnimationFrame(tick);
      }

      function play(withAudio) {
        if (!ready) return;
        stop();
        elapsed = 0;
        lastFrameAt = performance.now();
        playing = true;
        if (withAudio && sound.checked) {
          audio.currentTime = 0;
          audio.volume = 0.55;
          audio.playbackRate = settings.speed;
          audio.play().catch(() => {});
        }
        draw();
        animation = requestAnimationFrame(tick);
      }

      replay.addEventListener("click", () => play(true));
      pause.addEventListener("click", () => {
        if (playing) {
          stop();
          draw();
        } else if (ready && elapsed < duration) {
          playing = true;
          lastFrameAt = performance.now();
          if (sound.checked && audio.currentTime > 0 && !audio.ended) {
            audio.play().catch(() => {});
          }
          draw();
          animation = requestAnimationFrame(tick);
        }
      });
      seek.addEventListener("input", () => {
        stop();
        elapsed = Math.max(0, Math.min(duration, Number(seek.value)));
        draw();
      });
      sound.addEventListener("change", () => {
        if (!sound.checked) audio.pause();
        saveSettings();
      });
      window.addEventListener("openai:set_globals", (event) => {
        const saved = event.detail?.globals?.widgetState;
        if (saved) {
          applySettings(saved);
          draw();
        }
      });

      applySettings(window.openai?.widgetState);
      draw();
      replay.disabled = true;
      Promise.all(frameSources.map((source) => new Promise((resolve, reject) => {
        const frame = new Image();
        frame.onload = () => resolve(frame);
        frame.onerror = reject;
        frame.src = source;
      }))).then((loaded) => {
        frames = loaded;
        ready = true;
        replay.disabled = false;
        draw();
        if (!reducedMotion) play(false);
      }).catch(() => {
        phaseLabel.textContent = "动画未载入，请重新打开预览";
      });

      if (globalThis.Tweak) {
        const tweak = new Tweak({
          container: root.querySelector(".pq-device"),
          onChange: () => { draw(); saveSettings(); },
        });
        tweak.addSlider(settings, "iconWidth", { label: "问号大小", min: 90, max: 120, step: 2, unit: "px" });
        tweak.addSlider(settings, "speed", { label: "落地速度", min: 0.6, max: 1.4, step: 0.1, unit: "×" });
      }
    })();
  </script>
</div>
